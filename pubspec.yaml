name: apna
description: Apna - Your Personal & Shared Workspace. One Account, All Devices, Always in Sync.
publish_to: 'none'
version: 1.0.9+20

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  local_auth: ^2.2.0
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.2.1
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  permission_handler: ^13.0.2
  crypto: ^3.0.8
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env

