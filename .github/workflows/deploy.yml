name: Apna Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_deploy:
    name: Build, Test & Deploy Web & Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Decode Android Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/apna-release.jks
            echo "Release keystore restored successfully."
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 secret not set."
          fi

      - name: Configure Production Environment Variables & Assets
        run: |
          mkdir -p assets
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Test Suite
        run: flutter test

      # ----------------- WEB BUILD & DEPLOY -----------------
      - name: Build Flutter Web
        run: flutter build web --release --base-href /apna/

      - name: Deploy Web to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true

      # ----------------- ANDROID BUILD & SUPABASE UPLOAD -----------------
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK
        run: flutter build apk --split-per-abi --target-platform android-arm64 --release

      - name: Upload APK to Supabase Releases Bucket
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Uploading $APK_FILE to Supabase Storage..."
            curl -f -X POST \
              "${{ secrets.SUPABASE_URL }}/storage/v1/object/releases/apna.apk" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "x-upsert: true" \
              --data-binary @"$APK_FILE"
            echo "Supabase APK upload completed successfully."
          else
            echo "Error: APK file not found!"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0-latest"
          name: "Apna Production Release (Latest)"
          body: |
            ## Apna Production Release
            - Automated build from commit `${{ github.sha }}`
            - **Web URL**: https://shubha95m.github.io/apna/
            - **APK Download**: https://jkmdshurqjjcwshnfihi.supabase.co/storage/v1/object/public/releases/apna.apk
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
