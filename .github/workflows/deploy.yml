name: Apna Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_deploy:
    name: Build, Test & Deploy Web & Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Decode Android Release Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/apna-release.jks
            echo "Release keystore restored successfully."
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 secret not set."
          fi

      - name: Configure Production Environment Variables & Assets
        run: |
          mkdir -p assets
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Compute Release Version (Strictly Greater Than v1.0.2)
        id: release_version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | grep -v "\-b" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.2"
          fi
          LATEST_VER="${LATEST_TAG#v}"
          
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          HIGHER_VER=$(printf '%s\n%s' "$LATEST_VER" "$PUBSPEC_VER" | sort -V | tail -n 1)
          
          if [ "$PUBSPEC_VER" = "$LATEST_VER" ] || [ "$HIGHER_VER" = "$LATEST_VER" ]; then
            IFS="." read -r MAJOR MINOR PATCH <<< "$LATEST_VER"
            NEXT_PATCH=$((PATCH + 1))
            TARGET_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          else
            TARGET_VERSION="$PUBSPEC_VER"
          fi
          
          TAG_NAME="v${TARGET_VERSION}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            TAG_NAME="${TAG_NAME}-b${{ github.run_number }}"
          fi
          
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${TARGET_VERSION}" >> $GITHUB_OUTPUT
          
          # Update pubspec.yaml so flutter build apk and web build with exact version
          sed -i "s/^version: .*/version: ${TARGET_VERSION}+${{ github.run_number }}/" pubspec.yaml
          echo "Computed Tag Name: ${TAG_NAME}"
          echo "Updated pubspec version: $(grep '^version:' pubspec.yaml)"

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Test Suite
        run: flutter test

      # ----------------- WEB BUILD & DEPLOY -----------------
      - name: Build Flutter Web
        run: flutter build web --release --base-href /apna/

      - name: Deploy Web to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true

      # ----------------- ANDROID BUILD & SUPABASE UPLOAD -----------------
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Universal Signed Android Release APK
        run: flutter build apk --target-platform android-arm,android-arm64 --release

      - name: Upload APK to Supabase Releases Bucket
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Uploading $APK_FILE to Supabase Storage..."
            curl -f -X POST \
              "${{ secrets.SUPABASE_URL }}/storage/v1/object/releases/apna.apk" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "x-upsert: true" \
              --data-binary @"$APK_FILE"
            echo "Supabase APK upload completed successfully."
          else
            echo "Error: APK file not found!"
            exit 1
          fi


      - name: Create Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Apna Release ${{ steps.release_version.outputs.tag }}"
          make_latest: true
          body: |
            ## Apna Release ${{ steps.release_version.outputs.tag }}
            - **Commit**: `${{ github.sha }}`
            - **Web URL**: https://shubha95m.github.io/apna/
            - **APK Direct Download**: https://jkmdshurqjjcwshnfihi.supabase.co/storage/v1/object/public/releases/apna.apk
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Floating Latest Tag Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0-latest"
          target_commitish: ${{ github.sha }}
          name: "Apna Production Release (Latest Direct Link)"
          make_latest: false
          body: |
            ## Apna Production Release (Latest)
            - **Latest Version**: `${{ steps.release_version.outputs.tag }}`
            - **Commit**: `${{ github.sha }}`
            - **Web URL**: https://shubha95m.github.io/apna/
            - **APK Direct Download**: https://jkmdshurqjjcwshnfihi.supabase.co/storage/v1/object/public/releases/apna.apk
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
